name: epito

x-epito-build: &epito-build
  build:
    context: .
    dockerfile: Dockerfile
    target: runner
  image: ${EPITO_IMAGE:-epito:server}
  pull_policy: ${EPITO_PULL_POLICY:-build}

x-epito-runtime: &epito-runtime
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  HOSTNAME: 0.0.0.0
  PORT: "3000"
  EPITO_BACKEND_SERVICES: required
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: ${EPITO_DATABASE_NAME:-epito_prod}
  DATABASE_USER: epito_app
  DATABASE_PASSWORD_FILE: /run/secrets/db_password
  DATABASE_SSL: disable
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  EPITO_BASE_DOMAIN: ${EPITO_BASE_DOMAIN:-localhost}
  EPITO_UPLOADS_DIR: /app/data/uploads

x-document-worker-build: &document-worker-build
  build:
    context: .
    dockerfile: Dockerfile
    target: document_worker
  image: ${EPITO_WORKER_IMAGE:-epito-document-worker:server}
  pull_policy: ${EPITO_PULL_POLICY:-build}

x-ksef-worker-build: &ksef-worker-build
  build:
    context: .
    dockerfile: Dockerfile
    target: ksef_worker
  image: ${EPITO_KSEF_WORKER_IMAGE:-epito-ksef-worker:server}
  pull_policy: ${EPITO_PULL_POLICY:-build}

x-backup-worker-build: &backup-worker-build
  build:
    context: .
    dockerfile: Dockerfile
    target: backup_worker
  image: ${EPITO_BACKUP_IMAGE:-epito-backup:server}
  pull_policy: ${EPITO_PULL_POLICY:-build}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${EPITO_POSTGRES_CONTAINER_NAME:-epito-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EPITO_DATABASE_NAME:-epito_prod}
      POSTGRES_USER: epito_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_admin_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U epito_admin -d ${EPITO_DATABASE_NAME:-epito_prod}
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-internal

  redis:
    image: redis:7-alpine
    container_name: ${EPITO_REDIS_CONTAINER_NAME:-epito-redis}
    restart: unless-stopped
    user: redis
    command:
      - /bin/sh
      - -ec
      - |
        password="$$(cat /run/secrets/redis_password)"
        test -n "$$password"
        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --maxmemory-policy noeviction \
          --requirepass "$$password"
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-internal

  migrate:
    <<: *epito-build
    restart: "no"
    command:
      - node
      - scripts/migrate.mjs
    environment:
      <<: *epito-runtime
      DATABASE_ADMIN_USER: epito_admin
      DATABASE_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
      SUPERVISOR_EMAIL: ${EPITO_SUPERVISOR_EMAIL:?Set EPITO_SUPERVISOR_EMAIL in Portainer}
      SUPERVISOR_PASSWORD_FILE: /run/secrets/supervisor_password
    secrets:
      - postgres_admin_password
      - db_password
      - redis_password
      - supervisor_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-internal

  epito:
    <<: *epito-build
    container_name: ${EPITO_CONTAINER_NAME:-epito}
    restart: unless-stopped
    init: true
    ports:
      - "${EPITO_BIND_ADDRESS:-0.0.0.0}:${EPITO_PORT:-8063}:3000"
    environment:
      <<: *epito-runtime
      KSEF_ENCRYPTION_KEY_FILE: /run/secrets/ksef_encryption_key
      KSEF_POLL_INTERVAL_MS: ${EPITO_KSEF_POLL_INTERVAL_MS:-600000}
    volumes:
      - uploads_data:/app/data/uploads
    secrets:
      - db_password
      - redis_password
      - ksef_encryption_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend-internal

  document-worker:
    <<: *document-worker-build
    container_name: ${EPITO_WORKER_CONTAINER_NAME:-epito-document-worker}
    restart: unless-stopped
    init: true
    environment:
      <<: *epito-runtime
    volumes:
      - uploads_data:/app/data/uploads
    secrets:
      - db_password
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-internal

  ksef-worker:
    <<: *ksef-worker-build
    container_name: ${EPITO_KSEF_WORKER_CONTAINER_NAME:-epito-ksef-worker}
    restart: unless-stopped
    init: true
    environment:
      <<: *epito-runtime
      KSEF_ENCRYPTION_KEY_FILE: /run/secrets/ksef_encryption_key
      SUPERVISOR_EMAIL: ${EPITO_SUPERVISOR_EMAIL:?Set EPITO_SUPERVISOR_EMAIL in Portainer}
      SMTP_HOST: ${EPITO_SMTP_HOST:?Set EPITO_SMTP_HOST in Portainer}
      SMTP_PORT: ${EPITO_SMTP_PORT:-587}
      SMTP_SECURE: ${EPITO_SMTP_SECURE:-false}
      SMTP_USER: ${EPITO_SMTP_USER:?Set EPITO_SMTP_USER in Portainer}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_FROM: ${EPITO_SMTP_FROM:-}
      SMTP_REPLY_TO: ${EPITO_SMTP_REPLY_TO:-}
    volumes:
      - uploads_data:/app/data/uploads
    secrets:
      - db_password
      - redis_password
      - ksef_encryption_key
      - smtp_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-internal
      - ksef-egress

  backup:
    <<: *backup-worker-build
    container_name: ${EPITO_BACKUP_CONTAINER_NAME:-epito-backup}
    restart: unless-stopped
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${EPITO_DATABASE_NAME:-epito_prod}
      DATABASE_ADMIN_USER: epito_admin
      EPITO_BACKUP_RETENTION_DAYS: ${EPITO_BACKUP_RETENTION_DAYS:-14}
      EPITO_BACKUP_INTERVAL_SECONDS: ${EPITO_BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - uploads_data:/uploads:ro
      - backup_data:/backups
    secrets:
      - postgres_admin_password
      - backup_encryption_password
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /backups/.last-success
      interval: 5m
      timeout: 5s
      start_period: 5m
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-internal

volumes:
  postgres_data:
    name: ${EPITO_POSTGRES_VOLUME:-epito-postgres-data}
  redis_data:
    name: ${EPITO_REDIS_VOLUME:-epito-redis-data}
  uploads_data:
    name: ${EPITO_UPLOADS_VOLUME:-epito-uploads-data}
  backup_data:
    name: ${EPITO_BACKUP_VOLUME:-epito-backups}

secrets:
  postgres_admin_password:
    environment: EPITO_POSTGRES_ADMIN_PASSWORD
  db_password:
    environment: EPITO_DB_PASSWORD
  redis_password:
    environment: EPITO_REDIS_PASSWORD
  supervisor_password:
    environment: EPITO_SUPERVISOR_PASSWORD
  ksef_encryption_key:
    environment: EPITO_KSEF_ENCRYPTION_KEY
  smtp_password:
    environment: EPITO_SMTP_PASSWORD
  backup_encryption_password:
    environment: EPITO_BACKUP_ENCRYPTION_PASSWORD

networks:
  frontend:
    name: ${EPITO_NETWORK:-epito}
  backend-internal:
    name: ${EPITO_BACKEND_NETWORK:-epito-backend-internal}
    internal: true
  ksef-egress:
    name: ${EPITO_KSEF_EGRESS_NETWORK:-epito-ksef-egress}
