name: epito-local

x-epito-build: &epito-build
  build:
    context: .
    dockerfile: Dockerfile
    target: runner
  image: epito:local

x-epito-runtime: &epito-runtime
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  HOSTNAME: 0.0.0.0
  PORT: "3000"
  EPITO_BACKEND_SERVICES: required
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_NAME: ${EPITO_DATABASE_NAME:-epito_prod}
  DATABASE_USER: epito_app
  DATABASE_PASSWORD_FILE: /run/secrets/db_password
  DATABASE_SSL: disable
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  EPITO_BASE_DOMAIN: ${EPITO_BASE_DOMAIN:-localhost}
  EPITO_UPLOADS_DIR: /app/data/uploads

x-document-worker-build: &document-worker-build
  build:
    context: .
    dockerfile: Dockerfile
    target: document_worker
  image: epito-document-worker:local

x-ksef-worker-build: &ksef-worker-build
  build:
    context: .
    dockerfile: Dockerfile
    target: ksef_worker
  image: epito-ksef-worker:local

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${EPITO_POSTGRES_CONTAINER_NAME:-epito-local-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EPITO_DATABASE_NAME:-epito_prod}
      POSTGRES_USER: epito_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_admin_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U epito_admin -d ${EPITO_DATABASE_NAME:-epito_prod}
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend-internal

  redis:
    image: redis:7-alpine
    container_name: ${EPITO_REDIS_CONTAINER_NAME:-epito-local-redis}
    restart: unless-stopped
    user: redis
    command:
      - /bin/sh
      - -ec
      - |
        password="$$(cat /run/secrets/redis_password)"
        test -n "$$password"
        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --maxmemory-policy noeviction \
          --requirepass "$$password"
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-internal

  migrate:
    <<: *epito-build
    restart: "no"
    command:
      - node
      - scripts/migrate.mjs
    environment:
      <<: *epito-runtime
      DATABASE_ADMIN_USER: epito_admin
      DATABASE_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
      SUPERVISOR_EMAIL: ${EPITO_SUPERVISOR_EMAIL:?Set EPITO_SUPERVISOR_EMAIL}
      SUPERVISOR_PASSWORD_FILE: /run/secrets/supervisor_password
    secrets:
      - postgres_admin_password
      - db_password
      - redis_password
      - supervisor_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-internal

  epito:
    <<: *epito-build
    container_name: ${EPITO_CONTAINER_NAME:-epito-local}
    restart: unless-stopped
    init: true
    ports:
      - "${EPITO_BIND_ADDRESS:-127.0.0.1}:${EPITO_PORT:-8063}:3000"
    environment:
      <<: *epito-runtime
      KSEF_ENCRYPTION_KEY_FILE: /run/secrets/ksef_encryption_key
      KSEF_POLL_INTERVAL_MS: ${EPITO_KSEF_POLL_INTERVAL_MS:-600000}
    volumes:
      - uploads_data:/app/data/uploads
    secrets:
      - db_password
      - redis_password
      - ksef_encryption_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend-internal

  document-worker:
    <<: *document-worker-build
    container_name: ${EPITO_WORKER_CONTAINER_NAME:-epito-local-document-worker}
    restart: unless-stopped
    init: true
    environment:
      <<: *epito-runtime
    volumes:
      - uploads_data:/app/data/uploads
    secrets:
      - db_password
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-internal

  ksef-worker:
    <<: *ksef-worker-build
    container_name: ${EPITO_KSEF_WORKER_CONTAINER_NAME:-epito-local-ksef-worker}
    restart: unless-stopped
    init: true
    environment:
      <<: *epito-runtime
      KSEF_ENCRYPTION_KEY_FILE: /run/secrets/ksef_encryption_key
    volumes:
      - uploads_data:/app/data/uploads
    secrets:
      - db_password
      - redis_password
      - ksef_encryption_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend-internal
      - ksef-egress

volumes:
  postgres_data:
    name: ${EPITO_POSTGRES_VOLUME:-epito-local-postgres-data}
  redis_data:
    name: ${EPITO_REDIS_VOLUME:-epito-local-redis-data}
  uploads_data:
    name: ${EPITO_UPLOADS_VOLUME:-epito-local-uploads-data}

secrets:
  postgres_admin_password:
    file: ${EPITO_POSTGRES_ADMIN_PASSWORD_FILE:-./secrets/postgres_admin_password}
  db_password:
    file: ${EPITO_DB_PASSWORD_FILE:-./secrets/db_password}
  redis_password:
    file: ${EPITO_REDIS_PASSWORD_FILE:-./secrets/redis_password}
  supervisor_password:
    file: ${EPITO_SUPERVISOR_PASSWORD_FILE:-./secrets/supervisor_password}
  ksef_encryption_key:
    file: ${EPITO_KSEF_ENCRYPTION_KEY_FILE:-./secrets/ksef_encryption_key}

networks:
  frontend:
    name: ${EPITO_NETWORK:-epito-local}
  backend-internal:
    name: ${EPITO_BACKEND_NETWORK:-epito-local-backend-internal}
    internal: true
  ksef-egress:
    name: ${EPITO_KSEF_EGRESS_NETWORK:-epito-local-ksef-egress}
