name: Verify PostgreSQL and Redis

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Migrations, RLS and Redis
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: epito_ci
          POSTGRES_USER: epito_admin
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epito_admin -d epito_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare ephemeral test secrets
        run: |
          install -d -m 700 /tmp/epito-secrets
          printf '%s' 'ci-admin-password' > /tmp/epito-secrets/postgres_admin_password
          printf '%s' 'ci-app-password' > /tmp/epito-secrets/db_password
          printf '%s' 'ci-redis-password' > /tmp/epito-secrets/redis_password
          chmod 600 /tmp/epito-secrets/*

      - name: Start authenticated Redis
        run: |
          docker run --detach --name epito-ci-redis --publish 6379:6379 redis:7-alpine redis-server --appendonly yes --requirepass ci-redis-password
          for attempt in $(seq 1 20); do
            if docker exec epito-ci-redis redis-cli --no-auth-warning -a ci-redis-password ping | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Run PostgreSQL migrations
        run: npm run db:migrate:postgres
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_NAME: epito_ci
          DATABASE_ADMIN_USER: epito_admin
          DATABASE_ADMIN_PASSWORD_FILE: /tmp/epito-secrets/postgres_admin_password
          DATABASE_USER: epito_app
          DATABASE_PASSWORD_FILE: /tmp/epito-secrets/db_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_PASSWORD_FILE: /tmp/epito-secrets/redis_password

      - name: Verify isolation and Redis primitives
        run: node scripts/verify-backend.mjs
        env:
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_NAME: epito_ci
          DATABASE_ADMIN_USER: epito_admin
          DATABASE_ADMIN_PASSWORD_FILE: /tmp/epito-secrets/postgres_admin_password
          DATABASE_USER: epito_app
          DATABASE_PASSWORD_FILE: /tmp/epito-secrets/db_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_PASSWORD_FILE: /tmp/epito-secrets/redis_password
          EPITO_ALLOW_DESTRUCTIVE_TESTS: "true"
